<svg width="547" height="542" viewBox="0 0 547 542" fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    /* Float up-down */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-18px); }
    }

    /* Outer ring — slow clockwise */
    @keyframes spin-outer {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Middle ring — counter-clockwise */
    @keyframes spin-mid {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    /* Inner ring — faster clockwise */
    @keyframes spin-inner {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Glow pulse */
    @keyframes glow-pulse {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(0,201,78,0.4))
                drop-shadow(0 0 24px rgba(0,201,78,0.15));
      }
      50% {
        filter: drop-shadow(0 0 18px rgba(0,201,78,0.85))
                drop-shadow(0 0 48px rgba(0,201,78,0.4))
                drop-shadow(0 0 80px rgba(0,201,78,0.15));
      }
    }

    /* N letter subtle scale pulse */
    @keyframes n-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.06); opacity: 0.9; }
    }

    /* Root wrapper — тільки glow, без float */
    .root-float {
      animation: glow-pulse 3s ease-in-out infinite;
      transform-origin: 273.5px 271px;
    }

    /* Ring origins = center of SVG */
    .ring-outer {
      animation: spin-outer 18s linear infinite;
      transform-origin: 273.5px 271px;
    }
    .ring-mid {
      animation: spin-mid 12s linear infinite;
      transform-origin: 273.5px 271px;
    }
    .ring-inner {
      animation: spin-inner 8s linear infinite;
      transform-origin: 273.5px 271px;
    }
    .letter-n {
      animation: n-pulse 3s ease-in-out infinite;
      transform-origin: 273.5px 271px;
    }
  </style>

  <g class="root-float">

    <!-- Outer ring (largest arc) -->
